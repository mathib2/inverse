name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install ruff && ruff check .
      # The live Zetaris and sidecar tests skip on their own when those services are not reachable.
      - run: PYTHONPATH=core python -m pytest -q tests
